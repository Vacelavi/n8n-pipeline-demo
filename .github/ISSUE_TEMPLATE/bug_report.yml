name: Bug report
description: Report reproducible incorrect behaviour
title: "[Bug]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a quote with ...
        2. Enable ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
